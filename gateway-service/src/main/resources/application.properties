
# Spring Cloud Gateway Configuration

spring.application.name=gateway-service
server.port=8080

# Eureka client configuration (for service discovery)
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone = http://localhost:8761/eureka/

# Enable logging for routing
logging.level.org.springframework.cloud.gateway=DEBUG

# Enable SSL for API Gateway (optional, for production)
# server.ssl.key-store=classpath:keystore.jks
# server.ssl.key-store-password=password
# server.ssl.key-alias=tomcat

# Enable Timeout settings for HTTP client
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=5s


# Routing for User Service (running on port 8081)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service 
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/** 


# Routing for Course Service (running on port 8082)
spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=lb://course-service 
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses/** 
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=courseCB
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/courses 
resilience4j.circuitbreaker.instances.courseCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.courseCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.courseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseCB.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.courseCB.timeout-duration=5s

spring.cloud.gateway.routes[1].filters[1].name=Retry
spring.cloud.gateway.routes[1].filters[1].args.retries=3
spring.cloud.gateway.routes[1].filters[1].args.methods=GET
spring.cloud.gateway.routes[1].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.routes[1].filters[1].args.exceptions=java.io.IOException,java.util.concurrent.TimeoutException
spring.cloud.gateway.routes[1].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.routes[1].filters[1].args.backoff.maxBackoff=1000ms
spring.cloud.gateway.routes[1].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[1].filters[1].args.backoff.basedOnPreviousValue=false

# Routing for Payment Service (running on port 8083)
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service 
spring.cloud.gateway.routes[2].predicates[0]=Path=/payment/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=paymentCB
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/payment

jwt.secret=your-secret-key
